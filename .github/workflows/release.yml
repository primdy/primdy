name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            package: linux-x64
          - target: bun-linux-arm64
            package: linux-arm64
          - target: bun-darwin-x64
            package: darwin-x64
          - target: bun-darwin-arm64
            package: darwin-arm64
          - target: bun-windows-x64
            package: win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          PRIMDY_TARGET: ${{ matrix.target }}

      - name: Upload binary package
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: .release/server-${{ matrix.package }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(bun -e "console.log(require('./package.json').version)")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $PKG_VERSION. Bump package.json's version to match before tagging."
            exit 1
          fi

      - name: Build package
        run: bun run build

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: .release
          merge-multiple: false

      - name: Publish binaries
        run: |
          for package in .release/server-bun-*; do
            if [ -d "$package" ]; then
              echo "===== $package ====="
              npm publish "$package" --access public
            fi
          done

      - name: Publish to npm
        run: npm publish --access public

      - name: Pack tarball
        run: bun pm pack

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum .release/server-*/primdy-server* > primdy-SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" ./*.tgz .release/server-*/primdy-server* primdy-SHA256SUMS --generate-notes
